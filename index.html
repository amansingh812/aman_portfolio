        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() { return currentFetch; },
            set(value) { currentFetch = value; },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            const proto = Object.getPrototypeOf(window);
            if (proto) {
              Object.defineProperty(proto, 'fetch', {
                get() { return window.__customFetch || window.fetch; },
                set(value) { window.__customFetch = value; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (errProto) {
            // Silence errors or log silently to avoid console noise
          }
