            enumerable: true
          });
        } catch (err) {
          try {
            const proto = Object.getPrototypeOf(window);
            if (proto) {
              Object.defineProperty(proto, 'fetch', {
                get() { return window.__customFetch || window.fetch; },
                set(value) { window.__customFetch = value; },
                configurable: true,

              });
