<svg width="190" height="40" viewBox="0 0 190 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Orange square border (lighter on dark bg) -->
  <rect x="1" y="1" width="38" height="38" stroke="#F0A07A" stroke-width="4.5"/>
  <!-- Shadow B (offset, dimmer) -->
  <text x="23" y="28" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#C06030" opacity="0.6">B</text>
  <!-- Main B (white) -->
  <text x="20" y="26" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#FFFFFF">B</text>
  <!-- BUILD FIRST -->
  <text x="50" y="17" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="0.5" fill="#FFFFFF">BUILD FIRST</text>
  <!-- SITE accent -->
  <text x="50" y="33" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" letter-spacing="5" fill="#F0A07A">SITE</text>
</svg>
