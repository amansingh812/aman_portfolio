    <!-- Schema 2: FAQPage — unlocks People Also Ask rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What web design and development services do you offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Build First Site builds websites, web apps, e-commerce platforms, and SaaS products — from design handoff to launch. Services include custom Next.js and React builds, Flutter mobile apps, AI integrations, Stripe payment flows, admin dashboards, and performance audits."
          }
        },
        {
          "@type": "Question",
          "name": "How much does a website cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most projects fall between $600 and $15,000 USD depending on scope. A landing page starts at $600; a business website from $2,000; e-commerce from $4,000; an AI or SaaS MVP from $5,000. Fixed-price quotes upfront — never hourly billing."
          }
        },
        {
          "@type": "Question",
          "name": "What are the payment terms for web design projects?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "50% upfront to begin, 50% on completion. Larger projects can split into three milestones. We accept Wise, Stripe, PayPal, and bank transfer — works for clients in the US, UK, and Australia."
          }
        },
        {
          "@type": "Question",
          "name": "Do you work with international clients in Australia and the US?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — most freelance work is for businesses in Australia, the US, and the UK. We handle timezones with async communication and scheduled calls, delivering on time regardless of location."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a website take to build?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Landing page: approximately 2 weeks. Business website: 2–3 weeks. E-commerce or SaaS: 4–6 weeks. You get a clear timeline with milestones in the proposal before we start."
          }
        },
        {
          "@type": "Question",
          "name": "Will I own the website code?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "100%. The code is yours, hosted wherever you like — Vercel, AWS, your own server. No subscriptions, no lock-in. Full GitHub repo handed over on completion."
          }
        },
        {
          "@type": "Question",
          "name": "Do you offer ongoing website support after launch?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The first 30 days post-launch are free. After that, monthly retainers start at $600/month for ongoing development, updates, and support."
          }
        }
      ]
    }
    </script>
