<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1181" viewBox="0 0 768 1181" font-family="'Outfit','Inter',sans-serif">

  <!-- 65x100mm at 300 DPI = 768x1181px — Officeworks portrait card -->
  <rect width="768" height="1181" fill="#16181d"/>

  <!-- Top orange bar -->
  <rect x="0" y="0" width="768" height="10" fill="#f0744a"/>

  <!-- Left accent line -->
  <rect x="0" y="10" width="5" height="700" fill="#f0744a" opacity="0.4"/>

  <!-- Logo mark — browser window -->
  <g transform="translate(60, 80) scale(3.8)">
    <rect x="2" y="2.5" width="28" height="22" rx="5.5" fill="none" stroke="#fafafa" stroke-width="2.2"/>
    <line x1="2" y1="9.6" x2="30" y2="9.6" stroke="#fafafa" stroke-width="2.2"/>
    <circle cx="6.8" cy="6" r="1.5" fill="#f0744a"/>
    <circle cx="11.6" cy="6" r="1.5" fill="#fafafa"/>
    <circle cx="16.4" cy="6" r="1.5" fill="#fafafa"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="270" font-size="62" font-weight="700" letter-spacing="-1" fill="#fafafa">Build<tspan fill="#f0744a">First</tspan>Site</text>
  <text x="62" y="305" font-size="15" letter-spacing="4" fill="#6b7076">WEB DESIGN &amp; DEV STUDIO</text>

  <!-- Divider -->
  <line x1="60" y1="360" x2="708" y2="360" stroke="#f0744a" stroke-width="2.5"/>

  <!-- Name -->
  <text x="60" y="460" font-size="72" font-weight="700" letter-spacing="-1.5" fill="#fafafa">Aman</text>
  <text x="60" y="550" font-size="72" font-weight="700" letter-spacing="-1.5" fill="#fafafa">Singh</text>

  <!-- Title -->
  <text x="60" y="608" font-size="26" letter-spacing="0.5" fill="#f0744a">Full Stack Website Developer</text>

  <!-- Divider -->
  <line x1="60" y1="660" x2="708" y2="660" stroke="#2a2e35" stroke-width="1.5"/>

  <!-- Contact -->
  <g font-size="24" fill="#fafafa">
    <text x="60" y="730">contact@buildfirstsite.com</text>
    <text x="60" y="790">+61 413 146 498</text>
    <text x="60" y="850" fill="#f0744a">buildfirstsite.com</text>
    <text x="60" y="910" fill="#6b7076">US · UK · Australia</text>
  </g>

  <!-- Bottom tagline -->
  <line x1="60" y1="1060" x2="708" y2="1060" stroke="#2a2e35" stroke-width="1.5"/>
  <text x="384" y="1120" text-anchor="middle" font-size="18" letter-spacing="6" fill="#6b7076">BUILD · SHIP · SCALE</text>

  <!-- Bottom orange bar -->
  <rect x="0" y="1171" width="768" height="10" fill="#f0744a"/>

</svg>
