<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="'Outfit','Inter',sans-serif">

  <!-- Background -->
  <rect width="1080" height="1920" fill="#16181d"/>

  <!-- Subtle grid texture -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="url(#grid)"/>

  <!-- Top orange bar -->
  <rect x="0" y="0" width="1080" height="10" fill="#f0744a"/>

  <!-- Left accent line -->
  <rect x="0" y="10" width="6" height="1900" fill="#f0744a" opacity="0.3"/>

  <!-- Large faint icon watermark background -->
  <g transform="translate(540,960) scale(18)" opacity="0.03">
    <rect x="-16" y="-13.75" width="32" height="27.5" rx="5.5" fill="none" stroke="#fafafa" stroke-width="2.2"/>
    <line x1="-16" y1="-6.6" x2="16" y2="-6.6" stroke="#fafafa" stroke-width="2.2"/>
    <circle cx="-9.2" cy="-10" r="1.5" fill="#f0744a"/>
    <circle cx="-4.4" cy="-10" r="1.5" fill="#fafafa"/>
    <circle cx="0.4" cy="-10" r="1.5" fill="#fafafa"/>
  </g>

  <!-- Top section: Logo + Name -->
  <g transform="translate(0, 200)">
    <!-- Browser icon large -->
    <g transform="translate(440, 0) scale(5.5)">
      <rect x="2" y="2.5" width="28" height="22" rx="5.5" fill="none" stroke="#fafafa" stroke-width="2.2"/>
      <line x1="2" y1="9.6" x2="30" y2="9.6" stroke="#fafafa" stroke-width="2.2"/>
      <circle cx="6.8" cy="6" r="1.5" fill="#f0744a"/>
      <circle cx="11.6" cy="6" r="1.5" fill="#fafafa"/>
      <circle cx="16.4" cy="6" r="1.5" fill="#fafafa"/>
    </g>

    <!-- Wordmark -->
    <text x="540" y="340" text-anchor="middle" font-size="90" font-weight="700" letter-spacing="-1.5" fill="#fafafa">Build<tspan fill="#f0744a">First</tspan>Site</text>
    <text x="540" y="385" text-anchor="middle" font-size="20" letter-spacing="6" fill="#6b7076">WEB DESIGN &amp; DEVELOPMENT STUDIO</text>
  </g>

  <!-- Divider -->
  <line x1="80" y1="660" x2="1000" y2="660" stroke="#2a2e35" stroke-width="1.5"/>

  <!-- Name block centered -->
  <text x="540" y="790" text-anchor="middle" font-size="108" font-weight="700" letter-spacing="-2" fill="#fafafa">Aman</text>
  <text x="540" y="908" text-anchor="middle" font-size="108" font-weight="700" letter-spacing="-2" fill="#fafafa">Singh</text>
  <text x="540" y="970" text-anchor="middle" font-size="34" letter-spacing="1" fill="#f0744a">Full Stack Website Developer</text>

  <!-- Divider -->
  <line x1="80" y1="1030" x2="1000" y2="1030" stroke="#2a2e35" stroke-width="1.5"/>

  <!-- Contact details centered -->
  <!-- Email -->
  <g transform="translate(540, 1120)">
    <rect x="-400" y="-38" width="800" height="66" rx="33" fill="#1e2228" stroke="#2a2e35" stroke-width="1"/>
    <g transform="translate(-368, -14)" fill="none" stroke="#f0744a" stroke-width="2" stroke-linejoin="round">
      <rect x="0" y="0" width="28" height="20" rx="2"/>
      <path d="M0 1l14 10 14-10"/>
    </g>
    <text x="0" y="10" text-anchor="middle" font-size="30" fill="#fafafa">contact@buildfirstsite.com</text>
  </g>

  <!-- Phone -->
  <g transform="translate(540, 1218)">
    <rect x="-400" y="-38" width="800" height="66" rx="33" fill="#1e2228" stroke="#2a2e35" stroke-width="1"/>
    <path d="M-354 -18c-3 0-5 2-5 5 0 12 10 22 22 22 3 0 5-2 5-5v-4l-6-3-3 3c-4-1-8-5-9-9l3-3-3-6z" fill="none" stroke="#f0744a" stroke-width="2" stroke-linejoin="round"/>
    <text x="0" y="10" text-anchor="middle" font-size="30" fill="#fafafa">+61 413 146 498</text>
  </g>

  <!-- Website -->
  <g transform="translate(540, 1316)">
    <rect x="-400" y="-38" width="800" height="66" rx="33" fill="#1e2228" stroke="#2a2e35" stroke-width="1"/>
    <g transform="translate(-362, -18)" fill="none" stroke="#f0744a" stroke-width="1.8">
      <circle cx="14" cy="14" r="14"/>
      <path d="M0 14h28 M14 0c6 5 6 23 0 28 M14 0c-6 5-6 23 0 28"/>
    </g>
    <text x="0" y="10" text-anchor="middle" font-size="30" fill="#fafafa">buildfirstsite.com</text>
  </g>

  <!-- Location -->
  <g transform="translate(540, 1414)">
    <rect x="-400" y="-38" width="800" height="66" rx="33" fill="#1e2228" stroke="#2a2e35" stroke-width="1"/>
    <g transform="translate(-362, -18)" fill="none" stroke="#f0744a" stroke-width="1.8">
      <path d="M14 0C9 0 5 4 5 9c0 8 9 18 9 18s9-10 9-18c0-5-4-9-9-9z"/>
      <circle cx="14" cy="9" r="3.5"/>
    </g>
    <text x="0" y="10" text-anchor="middle" font-size="30" fill="#fafafa">US · UK · Australia</text>
  </g>

  <!-- Bottom section -->
  <line x1="80" y1="1550" x2="1000" y2="1550" stroke="#2a2e35" stroke-width="1.5"/>

  <text x="540" y="1660" text-anchor="middle" font-size="24" letter-spacing="10" fill="#6b7076">BUILD · SHIP · SCALE</text>

  <!-- Services tags -->
  <g transform="translate(540, 1740)">
    <rect x="-320" y="-28" width="180" height="46" rx="23" fill="#1e2228" stroke="#f0744a" stroke-width="1.5"/>
    <text x="-230" y="10" text-anchor="middle" font-size="22" fill="#f0744a">Web Design</text>

    <rect x="-120" y="-28" width="240" height="46" rx="23" fill="#1e2228" stroke="#f0744a" stroke-width="1.5"/>
    <text x="0" y="10" text-anchor="middle" font-size="22" fill="#f0744a">Development</text>

    <rect x="140" y="-28" width="180" height="46" rx="23" fill="#1e2228" stroke="#f0744a" stroke-width="1.5"/>
    <text x="230" y="10" text-anchor="middle" font-size="22" fill="#f0744a">SEO &amp; Growth</text>
  </g>

  <!-- Bottom orange bar -->
  <rect x="0" y="1910" width="1080" height="10" fill="#f0744a"/>

</svg>
